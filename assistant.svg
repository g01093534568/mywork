<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="AI 어시스턴트">
  <defs>
    <clipPath id="a-clip"><circle cx="64" cy="64" r="64"/></clipPath>
    <linearGradient id="a-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39405060"/>
      <stop offset="0" stop-color="#394050"/>
      <stop offset="1" stop-color="#22262f"/>
    </linearGradient>
    <linearGradient id="a-hair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4a3128"/>
      <stop offset="1" stop-color="#241611"/>
    </linearGradient>
    <linearGradient id="a-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d3b6"/>
      <stop offset="1" stop-color="#eab994"/>
    </linearGradient>
    <linearGradient id="a-cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a020"/>
      <stop offset="1" stop-color="#c9821a"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#a-clip)">
    <rect width="128" height="128" fill="url(#a-bg)"/>

    <!-- 뒤로 흐르는 머리카락 — 얼굴보다 먼저 깔아 실루엣을 만든다 -->
    <path d="M24 70c0-30 17-50 40-50s40 20 40 50c0 20-3 36-7 58H31c-4-22-7-38-7-58z" fill="url(#a-hair)"/>

    <!-- 목 -->
    <path d="M55 78h18v20c0 6-4 9-9 9s-9-3-9-9z" fill="#e0aa84"/>

    <!-- 어깨·상의 -->
    <path d="M8 128c2-18 14-28 32-32l24 16 24-16c18 4 30 14 32 32z" fill="url(#a-cloth)"/>
    <path d="M40 96l24 16 24-16-6-3-18 12-18-12z" fill="#fff" opacity="0.22"/>

    <!-- 얼굴 -->
    <ellipse cx="64" cy="58" rx="25" ry="30" fill="url(#a-skin)"/>
    <!-- 귀 -->
    <ellipse cx="39" cy="60" rx="4" ry="6" fill="#eab994"/>
    <ellipse cx="89" cy="60" rx="4" ry="6" fill="#eab994"/>

    <!-- 앞머리 — 한쪽으로 흐르는 가르마 -->
    <path d="M39 52c1-18 11-30 25-30s24 11 25 27c-3-9-9-15-17-17-5 7-19 14-33 20z" fill="url(#a-hair)"/>

    <!-- 눈썹 -->
    <path d="M47 51c4-3 9-3 12-1" stroke="#3a251d" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M69 50c3-2 8-2 12 1" stroke="#3a251d" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <!-- 눈 -->
    <ellipse cx="53" cy="60" rx="4.2" ry="4.6" fill="#2b1d18"/>
    <ellipse cx="75" cy="60" rx="4.2" ry="4.6" fill="#2b1d18"/>
    <circle cx="54.6" cy="58.4" r="1.5" fill="#fff" opacity="0.9"/>
    <circle cx="76.6" cy="58.4" r="1.5" fill="#fff" opacity="0.9"/>
    <!-- 속눈썹 -->
    <path d="M48 56.5c2-2 7-2.6 10-1.4" stroke="#2b1d18" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M70 55.1c3-1.2 8-0.6 10 1.4" stroke="#2b1d18" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- 볼 -->
    <ellipse cx="46" cy="69" rx="5" ry="3" fill="#e88f7a" opacity="0.35"/>
    <ellipse cx="82" cy="69" rx="5" ry="3" fill="#e88f7a" opacity="0.35"/>

    <!-- 코·입 -->
    <path d="M64 63v5" stroke="#d99a72" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M59 74c3 3 7 3 10 0" stroke="#b8544a" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
